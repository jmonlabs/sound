name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # node:test + assert throughout, no dependencies to install. The CDN
      # probe takes an injected fetch, so nothing here touches the network.
      - name: Unit tests
        run: node --test tests/gm.test.js tests/voices.test.js
